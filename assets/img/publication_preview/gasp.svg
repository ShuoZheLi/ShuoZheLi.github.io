<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img"><title>Guided Adversarial Self-Play (GASP)</title><desc>A single model plays a polluter that corrupts a window of its own correct reasoning trace and an agent that must detect and repair the corruption to reach the right answer, trained with outcome rewards; self-generated repairs are imitated as in-distribution guidance.</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="480" height="300" rx="14" fill="#ffffff"/><rect x="0.5" y="0.5" width="479" height="299" rx="14" fill="none" stroke="#e5e7eb"/><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0;0.022;0.172;0.194;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><circle cx="28" cy="25" r="10" fill="#1f2937"/><text x="28" y="29.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="45" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" >Sample a correct trace on a problem it can solve</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.178;0.2;0.341;0.362;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><circle cx="28" cy="25" r="10" fill="#1f2937"/><text x="28" y="29.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="45" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" >Polluter (the same model) corrupts a local window</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.347;0.369;0.591;0.612;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><circle cx="28" cy="25" r="10" fill="#1f2937"/><text x="28" y="29.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="45" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" >Agent must continue from the polluted context</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.597;0.619;0.828;0.85;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><circle cx="28" cy="25" r="10" fill="#1f2937"/><text x="28" y="29.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="45" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" >Guidance: imitate the model's own repair</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.834;0.856;0.972;0.994;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><text x="18" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" >One model, two roles → an adaptive curriculum</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.019;0.037;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="47" y="56" width="56" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="75" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle" >q</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.039;0.057;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="113" y="56" width="56" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/><text x="141" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle" >s₁</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.059;0.077;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="179" y="56" width="56" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/><text x="207" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle" >s₂</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.079;0.098;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="245" y="56" width="56" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/><text x="273" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle" >s₃</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.099;0.118;0.234;0.253;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="311" y="56" width="56" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/><text x="339" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle" >s₄</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.119;0.138;0.234;0.253;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="377" y="56" width="56" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="405" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="middle" >a* ✓</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.131;0.153;0.338;0.359;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><path d="M47,89 v5 H235 v-5" fill="none" stroke="#6b7280" stroke-width="1.2"/><text x="141" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" >shared prefix c₀:α</text><path d="M245,89 v5 H301 v-5" fill="none" stroke="#6b7280" stroke-width="1.2"/><text x="273" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" >window</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.197;0.216;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><animateTransform attributeName="transform" type="translate" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.197;0.234;1" values="0 -18;0 -18;0 0;0 0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="245" y="56" width="56" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="273" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="middle" >s₃′ ✗</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.244;0.266;0.338;0.359;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="309" y="58" width="126" height="24" rx="12" fill="#dc2626"/><text x="372" y="74.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >polluter: misleading</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.362;0.381;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><path d="M273.0,84 V126.0 H308" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.378;0.397;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="311" y="112" width="44" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="333" y="130.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" >s₄′</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.4;0.419;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="361" y="112" width="44" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="383" y="130.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" >a ✗</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.419;0.441;0.972;0.994;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><text x="47" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start" >follows the error</text><text x="47" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start" >→ polluter reward +1</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.456;0.475;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><path d="M273.0,84 V172.0 H308" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.472;0.491;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="311" y="158" width="44" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="333" y="176.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97706" text-anchor="middle" >wait!</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.497;0.516;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="361" y="158" width="44" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="383" y="176.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" >fix</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.522;0.541;0.972;0.991;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="411" y="158" width="44" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="433" y="176.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle" >a* ✓</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.537;0.559;0.972;0.994;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><text x="47" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start" >detects and repairs</text><text x="47" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start" >→ agent reward +1  (rare at first)</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.656;0.678;0.831;0.853;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="357" y="154" width="52" height="36" rx="9" fill="none" stroke="#2563eb" stroke-width="2.5"><animate attributeName="stroke-opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.662;0.688;0.719;0.75;0.781;0.812;0.828;1" values="0;0;1;0.25;1;0.25;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/></rect></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.375;0.397;0.588;0.609;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="47" y="204" width="386" height="74" rx="10" fill="#f8fafc" stroke="#e5e7eb"/><text x="61" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" >Outcome rewards only (no human labels, no teacher):</text><text x="61" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start" >agent:     r = 1[ a = a* ]</text><text x="61" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start" >polluter: r = 1 − r_agent</text><text x="419" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" >both trained with GRPO</text></g><g ><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" keyTimes="0;0.606;0.628;0.831;0.853;1" values="0;0;1;1;0;0" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/><rect x="47" y="204" width="386" height="88" rx="10" fill="#f8fafc" stroke="#e5e7eb"/><text x="59" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >Shown clean s₃ vs. polluted s₃′, the model</text><text x="59" y="239" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >writes its own fix; the agent imitates it</text><text x="59" y="